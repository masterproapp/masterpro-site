<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | MasterPro</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1a1a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf8f2; --ink:#1a1a1a; --orange:#f96302; --orange-deep:#d35200; --soft:#555; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; }
  body {
    font-family:'IBM Plex Sans',sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px;
    background-image:
      linear-gradient(rgba(26,26,26,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,26,26,0.045) 1px, transparent 1px);
    background-size:32px 32px;
  }
  .eyebrow {
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--orange);
    letter-spacing:0.18em; text-transform:uppercase; margin-bottom:18px;
  }
  h1 {
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(44px,9vw,96px); line-height:0.95; letter-spacing:-0.025em; margin:0 0 18px;
  }
  h1 span { color:var(--orange); }
  p { color:var(--soft); font-size:17px; margin:0 0 30px; }
  .btn {
    display:inline-block; background:var(--orange); color:#fff;
    font-family:'Archivo',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:0.08em; text-transform:uppercase;
    padding:14px 28px; border-radius:2px; text-decoration:none;
    box-shadow:0 4px 0 var(--orange-deep);
  }
  .btn:hover { transform:translateY(2px); box-shadow:0 2px 0 var(--orange-deep); }
</style>
</head>
<body>
  <div>
    <div class="eyebrow">// MasterPro</div>
    <h1>Page not <span>found.</span></h1>
    <p>That link does not exist, but our pros are still standing by.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>
